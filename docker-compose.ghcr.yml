# 使用 GitHub Actions 构建并发布到 GHCR 的远程镜像启动，不在本地构建。
# 镜像来源：ghcr.io/sxkiss/ydisks-xianyu-helper（默认 tag：sxkiss-local）
# 用法：
#   1) 复制 .env.example 为 .env 并填写 DATABASE_URL / XIANYU_DATA_KEY / POSTGRES_PASSWORD
#   2) docker compose -f docker-compose.ghcr.yml --env-file .env up -d
#   3) 首次初始化管理员：
#      docker compose -f docker-compose.ghcr.yml --env-file .env --profile init run --rm init-admin
#
# 登录 GHCR（镜像为 private 时需要）：
#   echo "$GITHUB_TOKEN" | docker login ghcr.io -u 用户名 --password-stdin

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置 DATABASE_URL}
  XIANYU_DATA_KEY: ${XIANYU_DATA_KEY:?请在 .env 中配置 XIANYU_DATA_KEY}
  XIANYU_UPLOAD_DIR: ${XIANYU_UPLOAD_DIR:-/app/data/uploads}
  TZ: ${TZ:-Asia/Shanghai}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
  # 风控滑块需有头浏览器（Xvfb 虚拟显示），headless 会被闲鱼风控直接拒绝
  DISPLAY: ${DISPLAY:-:99}
  XIANYU_CONTINUE_AFTER_UNCERTAIN: ${XIANYU_CONTINUE_AFTER_UNCERTAIN:-1}

x-app-volumes: &app-volumes
  - app_data:/app/data
  - browser_data:/app/browser_data

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-trixie}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 中配置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中配置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 直接使用 GHCR 远程镜像，无 build 段（本地不编译）。
  app:
    image: ${XIANYU_IMAGE:-ghcr.io/sxkiss/ydisks-xianyu-helper:sxkiss-local}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    # 先起 Xvfb 虚拟显示，供风控滑块有头浏览器使用，再启动服务
    command:
      - /bin/sh
      - -c
      - >-
        rm -f /tmp/.X99-lock /tmp/.X11-unix/X99 ;
        (Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &) ;
        sleep 1 ;
        exec /app/xianyu-server -addr :59188
    ports:
      - "${XIANYU_BIND_ADDRESS:-0.0.0.0}:${XIANYU_HTTP_PORT:-59188}:59188"
    volumes: *app-volumes
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:59188/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  init-admin:
    image: ${XIANYU_IMAGE:-ghcr.io/sxkiss/ydisks-xianyu-helper:sxkiss-local}
    pull_policy: always
    profiles: ["init"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      XIANYU_ADMIN_PASSWORD: ${XIANYU_ADMIN_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - >-
        test -n "$$XIANYU_ADMIN_PASSWORD" ||
        { echo "XIANYU_ADMIN_PASSWORD is required"; exit 1; };
        exec /app/xianyu-server -init-admin -admin-password "$$XIANYU_ADMIN_PASSWORD"
    volumes: *app-volumes

volumes:
  postgres_data:
  app_data:
  browser_data:
